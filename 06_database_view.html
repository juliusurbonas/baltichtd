crew was not maintaining radio communication with the regional air traﬃc control centre.", "Key source": "Lithuanian Ministry of National Defence (KAM), KAM_Interceptions_2024.pdf, p. 21", "Verification": "VERIFIED", "Attribution / status": "Russian state aircraft; hostile intent not established"}, {"Incident ID": "REG-340", "date": "2024-06-02", "Event / campaign": "Russian SU-34 aircraft triggered NATO identification/escort", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-MIL-CONVENTIONAL", "Short description": "On June 2 NATO fighter aircraft were scrambled to identify and escort one SU-34 flying from mainland Russia to Kaliningrad via international airspace, without the flight plan, onboard transponder switched oﬀ, not maintaining radio communication with the regional air traﬃc control centre.", "Key source": "Lithuanian Ministry of National Defence (KAM), KAM_Interceptions_2024.pdf, p. 21", "Verification": "VERIFIED", "Attribution / status": "Russian state aircraft; hostile intent not established"}, {"Incident ID": "REG-341", "date": "2024-06-03", "Event / campaign": "Russian SU-24 aircraft triggered NATO identification/escort", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-MIL-CONVENTIONAL", "Short description": "On June 3 fighter aircraft of the NATO Baltic Air Policing Mission were scrambled to identify and escort what might had been two SU-24 aircraft that took oﬀ in Kaliningrad and continued to move in the international airspace over the Baltic Sea. Neither had flight plans, the onboard transponders were switched oﬀ, the crews were not maintaining radio contact with the regional air traﬃc control centre.", "Key source": "Lithuanian Ministry of National Defence (KAM), KAM_Interceptions_2024.pdf, p. 22", "Verification": "VERIFIED", "Attribution / status": "Russian state aircraft; hostile intent not established"}, {"Incident ID": "REG-342", "date": "2024-06-04", "Event / campaign": "Russian AN-12, IL-20 aircraft triggered NATO identification/escort", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-INTEL-PREP", "Short description": "On June 4 NATO Air Policing fighter aircraft were scrambled to identify and escort one AN-12 and one IL-20. The AN-12 was flying from the mainland Russia to Kaliningrad through the international airspace, with onboard transponder switched oﬀ, without a flight plan, though keeping in touch with the regional air traﬃc control centre. The IL-20 was flying from the mainland Russia to Kaliningrad via the international airspace without the flight plan, its onboard transponder switched oﬀ, but maintaining radio communication with the regional air traﬃc control centre.", "Key source": "Lithuanian Ministry of National Defence (KAM), KAM_Interceptions_2024.pdf, p. 22", "Verification": "VERIFIED", "Attribution / status": "Russian state aircraft; hostile intent not established"}, {"Incident ID": "REG-343", "date": "2024-06-04", "Event / campaign": "Russian TU-134, AN-12 aircraft triggered NATO interception", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-MIL-CONVENTIONAL", "Short description": "On June 4 NATO fighter jets were scrambled to intercept an AN-12 and a TU-134: the AN-12 flew into the international airspace from KLAiningrad and headed for the mainland Russia according to a pre-filed flight plan and maintaining radio communication but with its onboard transponder kept oﬀ. The TU-134 also flew out of Kaliningrad into the international airspace and proceeded to the mainland of the Russian Federation, with its onboard transponder switched oﬀ, according to a pre-filed flight plan, maintaining radio communication with the regional air traﬃc control centre.", "Key source": "Lithuanian Ministry of National Defence (KAM), KAM_Interceptions_2024.pdf, p. 22", "Verification": "VERIFIED", "Attribution / status": "Russian state aircraft; hostile intent not established"}, {"Incident ID": "REG-344", "date": "2024-06-06", "Event / campaign": "Russian TU-134 aircraft triggered NATO interception", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-MIL-CONVENTIONAL", "Short description": "On June 6 NATO fighter jets were scrambled to intercept one TU-134 flying from Kaliningrad to the mainland of the Russian Federation through the international airspace. The TU-134 was flying through the international airspace to mainland Russia from Kaliningrad, it had no pre-filed flight plan, with the onboard transponder switched on and maintained radio communication with the regional air traﬃc control centre.", "Key source": "Lithuanian Ministry of National Defence (KAM), KAM_Interceptions_2024.pdf, p. 22", "Verification": "VERIFIED", "Attribution / status": "Russian state aircraft; hostile intent not established"}, {"Incident ID": "REG-345", "date": "2024-06-07", "Event / campaign": "Russian IL-78, TU-214PU aircraft triggered NATO interception", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-MIL-CONVENTIONAL", "Short description": "On June 7 NATO fighter aircraft were scrambled to intercept one IL-78 and one TU-214PU. The IL-78 was flying from the mainland of the Russian Federation to Kaliningrad via the international airspace, without the pre-filed flight plan, without using its onboard transponder nor keeping radio communication with the regional air traﬃc control centre. The TU-214PU was flying from Kaliningrad to mainland Russia through the international airspace, in accordance with a pre-filed flight plan, with its onboard transponder switched on and maintaining radio communication with the regional air traﬃc control centre.", "Key source": "Lithuanian Ministry of National Defence (KAM), KAM_Interceptions_2024.pdf, p. 22", "Verification": "VERIFIED", "Attribution / status": "Russian state aircraft; hostile intent not established"}, {"Incident ID": "REG-346", "date": "2024-06-07", "Event / campaign": "Russian SU-24MR aircraft triggered NATO identification", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-INTEL-PREP", "Short description": "On June 7 fighter aircraft conducting the NATO Air Policing Mission in the Baltic states were scrambled to identify what was likely an IL-20 of the Russian Federation which took oﬀ from Kaliningrad and was flying in the international airspace over the Baltic Sea. The aircraft had no flight plan and was not maintaining radio communication, its onboard transponder was switched oﬀ. Another aircraft in need of identification was likely a SU-24MR which took oﬀ in Kaliningrad and was moving in the international airspace over the Baltic Sea. It had no flight plan, its onboard transponder was not switched on and the crew was not maintaining radio communication with the regional air traﬃc control centre.", "Key source": "Lithuanian Ministry of National Defence (KAM), KAM_Interceptions_2024.pdf, p. 22", "Verification": "VERIFIED", "Attribution / status": "Russian state aircraft; hostile intent not established"}, {"Incident ID": "REG-347", "date": "2024-06-07", "Event / campaign": "Russian SU-34, AN-30 aircraft triggered NATO identification/escort", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-MIL-CONVENTIONAL", "Short description": "On June 7 NATO fighter jets were scrambled to identify and escort one SU-34 and one AN-30. The SU-34 was flying from the mainland of Russian Federation to Kaliningrad via the international airspace without the flight plan, its onboard transponder oﬀ, not maintaining radio communication with the regional air traﬃc control centre. The AN-30 flew out of Kaliningrad into the international airspace and returned. It had no pre-filed flight plan, the crew kept the onboard transponder switched oﬀ and did not keep radio communication with the regional air traﬃc control centre.", "Key source": "Lithuanian Ministry of National Defence (KAM), KAM_Interceptions_2024.pdf, p. 22", "Verification": "VERIFIED", "Attribution / status": "Russian state aircraft; hostile intent not established"}, {"Incident ID": "REG-348", "date": "2024-06-07", "Event / campaign": "Russian TU-214PU, SU-27 aircraft triggered NATO identification/escort", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-MIL-CONVENTIONAL", "Short description": "On June 7 NATO fighter aircraft scrambled to identify what was likely one TU-214PU and two SU-27 aircraft of the Russian Federation. The TU-214PU was flying from mainland Russia into the international airspace and then to Kaliningrad, it had no plan pre-filed for the flight, the onboard transponder as oﬀ and the crew was not maintaining radio communication with the regional air traﬃc control centre. Both of the SU-27 took oﬀ in Kaliningrad, met and flew escort of the TU-214PU’s flight, they had no flight plans, kept the onboard transponders switched oﬀ and were not keeping radio communication with the regional air traﬃc control centre.", "Key source": "Lithuanian Ministry of National Defence (KAM), KAM_Interceptions_2024.pdf, p. 22", "Verification": "VERIFIED", "Attribution / status": "Russian state aircraft; hostile intent not established"}, {"Incident ID": "REG-349", "date": "2024-06-08", "Event / campaign": "Russian IL-76, SU-24, SU24S aircraft triggered NATO identification/escort", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-MIL-CONVENTIONAL", "Short description": "On June 8 the NATO Air Policing fight jets were scrambled to identify and escort one IL-76 and two SU-24 aircraft. The IL-76 was flying from Kaliningrad to mainland Russia via the international airspace, it had no flight plan , though the onboard transponder was switched on and the crew was maintaining radio communication with the regional air traﬃc control centre. Both of the SU24s flew out of Kaliningrad into the international airspace and then returned, they had no pre-filed flight plans, the onboard transponders were switched of , neither of the crews was maintaining radio communication with the regional air traﬃc control centre.", "Key source": "Lithuanian Ministry of National Defence (KAM), KAM_Interceptions_2024.pdf, p. 22", "Verification": "VERIFIED", "Attribution / status": "Russian state aircraft; hostile intent not established"}, {"Incident ID": "REG-350", "date": "2024-06-09", "Event / campaign": "Russian AN-72 aircraft triggered NATO interception", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-MIL-CONVENTIONAL", "Short description": "On June 9 NATO fighter aircraft were scrambled to intercept one AN-72 flying from the mainland to Kaliningrad through the international airspace. It had no pre-filed flight plan, the crew kept the onboard transponder switched on and kept radio communication with the regional air traﬃc control centre.", "Key source": "Lithuanian Ministry of National Defence (KAM), KAM_Interceptions_2024.pdf, p. 22", "Verification": "VERIFIED", "Attribution / status": "Russian state aircraft; hostile intent not established"}, {"Incident ID": "REG-351", "date": "2024-06-09", "Event / campaign": "Russian IL-76, AN-72 aircraft triggered NATO interception", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-MIL-CONVENTIONAL", "Short description": "On June 9 NATO fighter jets were scrambled to intercept one IL-76 and one AN-72. The IL-76 was flying from Kaliningrad to the mainland Russia through the international airspace, it had no flight plan, but the onboard transponder as oﬀ and radio communication was maintained. The AN-72 was flying from Kaliningrad to mainland Russia via the international airspace, without the flight plan, the crew kept the onboard transponder on and maintained radio communication.", "Key source": "Lithuanian Ministry of National Defence (KAM), KAM_Interceptions_2024.pdf, p. 23", "Verification": "VERIFIED", "Attribution / status": "Russian state aircraft; hostile intent not established"}, {"Incident ID": "REG-352", "date": "2024-06-10", "Event / campaign": "Russian IL-20, SU-27 aircraft triggered NATO interception", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-INTEL-PREP", "Short description": "On June 10 NATO fighter aircraft were scrambled to intercept one IL-20 flying in international airspace over the Baltic Sea without the flight plan. NATO fighter jets also intercepted one SU-27 as it was flying in international airspace over the Baltic Sea.", "Key source": "Lithuanian Ministry of National Defence (KAM), KAM_Interceptions_2024.pdf, p. 24", "Verification": "VERIFIED", "Attribution / status": "Russian state aircraft; hostile intent not established"}, {"Incident ID": "REG-353", "date": "2024-06-10", "Event / campaign": "Russian SU-24MR aircraft triggered NATO identification/escort", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-MIL-CONVENTIONAL", "Short description": "On June 10 aircraft of the NATO Baltic Air Policing Detachment were scrambled to identify and escort two SU-24MR flying in international airspace over the Baltic Sea.", "Key source": "Lithuanian Ministry of National Defence (KAM), KAM_Interceptions_2024.pdf, p. 24", "Verification": "VERIFIED", "Attribution / status": "Russian state aircraft; hostile intent not established"}, {"Incident ID": "REG-354", "date": "2024-06-11", "Event / campaign": "Russian IL-20 aircraft triggered NATO identification/escort", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-INTEL-PREP", "Short description": "On June 11 NATO fighter aircraft were scramble to identify and escort one IL-20 flying from Kaliningrad into international airspace and back without the pre-filed flight plan, its onboard transponder oﬀ, not maintaining radio communication with the regional air traﬃc control centre.", "Key source": "Lithuanian Ministry of National Defence (KAM), KAM_Interceptions_2024.pdf, p. 24", "Verification": "VERIFIED", "Attribution / status": "Russian state aircraft; hostile intent not established"}, {"Incident ID": "REG-355", "date": "2024-06-11", "Event / campaign": "Russian IL-96, SU-27, SU-30SM aircraft triggered NATO interception", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-MIL-CONVENTIONAL", "Short description": "On June 11 NATO fighter jets were scrambled to intercept one IL-96 flying from Kaliningrad to mainland Russia through international airspace. The IL-96 had a flight plan, its onboard transponder was switched on and the crew was maintaining radio communication. NATO fighter jets also intercepted two SU-27 that escorted the IL-96 from Kaliningrad into international airspace and then went back to Kaliningrad, as well as two SU-30SM that took oﬀ in the mainland Russia, met the IL-96 and escorted it to the mainland Russia. None of the four had flight plans, their onboard transponders were switched oﬀ and radio communication as not maintained.", "Key source": "Lithuanian Ministry of National Defence (KAM), KAM_Interceptions_2024.pdf, p. 24", "Verification": "VERIFIED", "Attribution / status": "Russian state aircraft; hostile intent not established"}, {"Incident ID": "REG-356", "date": "2024-06-12", "Event / campaign": "Russian AN-30 aircraft triggered NATO interception", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-MIL-CONVENTIONAL", "Short description": "On June 12 NATO Air Policing fighter jets were scrambled to intercept one AN-30 which flew from Kaliningrad into international airspace and back without the flight plan and not maintaining radio communication, though its onboard transponder was oﬀ.", "Key source": "Lithuanian Ministry of National Defence (KAM), KAM_Interceptions_2024.pdf, p. 24", "Verification": "VERIFIED", "Attribution / status": "Russian state aircraft; hostile intent not established"}, {"Incident ID": "REG-357", "date": "2024-06-13", "Event / campaign": "Russian IL-20 aircraft triggered NATO identification/escort", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-INTEL-PREP", "Short description": "On June 13 NATO fighter aircraft were scrambled to identify and escort one IL-20 flying from Kaliningrad into international airspace and back without the flight plan, not using the onboard transponder, not maintaining radio communication with the regional air traﬃc control centre.", "Key source": "Lithuanian Ministry of National Defence (KAM), KAM_Interceptions_2024.pdf, p. 24", "Verification": "VERIFIED", "Attribution / status": "Russian state aircraft; hostile intent not established"}, {"Incident ID": "REG-358", "date": "2024-06-13", "Event / campaign": "Russian SU-24MS aircraft triggered NATO interception", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-MIL-CONVENTIONAL", "Short description": "On June 13 NATO fighter aircraft were scrambled to intercept two SU-24Ms on a flight from Kaliningrad and back via international airspace, without the flight plans, no radio communication, their onboard transponders switched oﬀ.", "Key source": "Lithuanian Ministry of National Defence (KAM), KAM_Interceptions_2024.pdf, p. 24", "Verification": "VERIFIED", "Attribution / status": "Russian state aircraft; hostile intent not established"}, {"Incident ID": "REG-359", "date": "2024-06-14", "Event / campaign": "Russian IL-20, AN-30 aircraft triggered NATO identification", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-INTEL-PREP", "Short description": "On June 14 NATO fighter jets were scrambled to identify one IL-20 flying from Kaliningrad to mainland Russia via international airspace. It had no pre-filed flight plan, the onboard transponder was switched oﬀ, the crew was maintaining radio communication with the regional air traﬃc control centre. NATO crews also identified one AN-30 flying from Kaliningrad and back via international airspace, without the flight plan, its onboard transponder switched oﬀ, not maintaining radio communication.", "Key source": "Lithuanian Ministry of National Defence (KAM), KAM_Interceptions_2024.pdf, p. 24", "Verification": "VERIFIED", "Attribution / status": "Russian state aircraft; hostile intent not established"}, {"Incident ID": "REG-360", "date": "2024-06-14", "Event / campaign": "Russian SU-24M aircraft triggered NATO interception", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-MIL-CONVENTIONAL", "Short description": "On June 14 NATO fighter jets were scrambled to intercept two SU-24M flying from Kaliningrad into international airspace and then back, neither had their onboard transponders switched on, the crews were not maintaining radio communication and did not have the flights plans.", "Key source": "Lithuanian Ministry of National Defence (KAM), KAM_Interceptions_2024.pdf, p. 24", "Verification": "VERIFIED", "Attribution / status": "Russian state aircraft; hostile intent not established"}, {"Incident ID": "REG-361", "date": "2024-06-14", "Event / campaign": "Russian SU-30SM aircraft triggered NATO interception", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-MIL-CONVENTIONAL", "Short description": "On June 14 NATO Air Policing fighter jets were scrambled to intercept two SU-30SM which were on a flight from Kaliningrad and back through international airspace. Their onboard transponders were switched oﬀ, the crews had no flight plans and did not maintain radio communication.", "Key source": "Lithuanian Ministry of National Defence (KAM), KAM_Interceptions_2024.pdf, p. 24", "Verification": "VERIFIED", "Attribution / status": "Russian state aircraft; hostile intent not established"}, {"Incident ID": "REG-362", "date": "2024-06-15", "Event / campaign": "Russian AN-30, SU-34, SU-27, SU-24MR aircraft triggered NATO interception", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-MIL-CONVENTIONAL", "Short description": "On June 15 NATO fighter aircraft were scrambled to intercept one AN-30 that flew out into international airspace from Kaliningrad and returned. It had no flight plan, the onboard transponder was switched on, the crew was maintaining radio communication with the regional air traﬃc control centre. They also intercepted two SU-34, two SU-27 and one SU-24MR which were flying without the flight plans, without maintaining radio communication and with switched oﬀ onboard transponders from Kaliningrad and back via international airspace.", "Key source": "Lithuanian Ministry of National Defence (KAM), KAM_Interceptions_2024.pdf, p. 24", "Verification": "VERIFIED", "Attribution / status": "Russian state aircraft; hostile intent not established"}, {"Incident ID": "REG-363", "date": "2024-06-17", "Event / campaign": "Russian SU-34, SU-27 aircraft triggered NATO interception", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-MIL-CONVENTIONAL", "Short description": "On June 17 fighter aircraft of the NATO Baltic Air Policing Mission Detachment were scrambled to intercept three aircraft of the Russian Federation, one SU-34 and two SU-27, flying through international airspace over the Baltic Sea from Kaliningrad. They had no pre-filed flight plans, the onboard transponders were kept oﬀ, communication with the regional air traﬃc control centre as not maintained.", "Key source": "Lithuanian Ministry of National Defence (KAM), KAM_Interceptions_2024.pdf, p. 25", "Verification": "VERIFIED", "Attribution / status": "Russian state aircraft; hostile intent not established"}, {"Incident ID": "REG-364", "date": "2024-06-18", "Event / campaign": "Russian SU-30SM, SU-24, AN-72 aircraft triggered NATO interception", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-MIL-CONVENTIONAL", "Short description": "On June 18 NATO fighter aircraft were scrambled to intercept one SU-30SM and one SU-24 flying from Kaliningrad and back through international airspace. The aircraft had no flight plans, their onboard transponders were switched oﬀ, the crews were not keeping radio contact with the regional air traﬃc control centre. NATO fighter jets also intercepted one AN-72 flying from Kaliningrad to mainland Russia. It had no pre-filed flight plan but the crew maintained radio communication with the regional air traﬃc control centre and kept the onboard transponder switched on.", "Key source": "Lithuanian Ministry of National Defence (KAM), KAM_Interceptions_2024.pdf, p. 25", "Verification": "VERIFIED", "Attribution / status": "Russian state aircraft; hostile intent not established"}, {"Incident ID": "REG-365", "date": "2024-06-18", "Event / campaign": "Russian SU- n(s)": "JRC-AIRSPACE; JRC-MIL-CONVENTIONAL", "Short description": "French Rafale fighters deployed in Lithuania intercepted two Russian Su-30SM fighters in the Baltic region.", "Key source": "SAHASEC", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_DOCUMENTED"}, {"Incident ID": "REG-637", "date": "2026-06-01", "Event / campaign": "Russian Su-30 flight triggered NATO Baltic Air Policing response", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-MIL-CONVENTIONAL", "Short description": "NATO Baltic Air Policing fighters identified and escorted Russian Su-30 aircraft flying between Kaliningrad and mainland Russia.", "Key source": "SAHASEC / Lithuanian Ministry of Defence", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_DOCUMENTED"}, {"Incident ID": "REG-638", "date": "2026-06-02", "Event / campaign": "Six Russian military aircraft intercepted by NATO Baltic Air Policing", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-MIL-CONVENTIONAL", "Short description": "French Rafale fighters deployed at Šiauliai scrambled to identify and escort six Russian military aircraft operating in the Baltic area of responsibility.", "Key source": "SAHASEC / Aerospace Global News", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_DOCUMENTED"}, {"Incident ID": "REG-639", "date": "2026-06-02", "Event / campaign": "Russian SU35, IL76, SU-24, SU-34 and 1 more aircraft triggered NATO interception", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-MIL-CONVENTIONAL", "Short description": "On June 2 NATO fighter jets intercepted one SU35 which was flying through international airspace from Kaliningrad and back. Its onboard transponder was switched oﬀ, the crew had no flight plan and was not maintaining radio communication. Also, one IL76 was identified on the same scramble, flying between mainland Russia and Kaliningrad via international airspace. Its onboard transponder was switched on, the crew was maintaining radio communication but had no flight plan. Also, one SU-24 and SU-34 were intercepted flying from mainland Russia to Kaliningrad via international airspace, with the onboard transponders oﬀ, no flight plans, not maintaining radio communication with the regional air traﬃc control centre. Other aircraft intercepted on the same occasion were an AN-30 flying between mainland Russia and Kaliningrad through international airspace, no onboard transponder, no flight plan, no radio communication, and one AN-12, flying from mainland Russia to Kaliningrad via international airspace with the onboard transponder switched on and maintaining radio communication, but without the pre-filed flight plan.", "Key source": "Lithuanian Ministry of National Defence (KAM), KAM_Interceptions_2026.pdf, p. 20", "Verification": "VERIFIED", "Attribution / status": "Russian state aircraft; hostile intent not established"}, {"Incident ID": "REG-640", "date": "2026-06-03", "Event / campaign": "Russian SU-30S aircraft triggered NATO interception", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-MIL-CONVENTIONAL", "Short description": "On June 3 NATO air policing fighter aircraft intercepted one SU-30S flying from mainland Russia to Kaliningrad through international airspace with its onboard transponder switched on and maintaining radio communication with the regional air traﬃc control centre, but without the pre-filed flight plan.", "Key source": "Lithuanian Ministry of National Defence (KAM), KAM_Interceptions_2026.pdf, p. 24", "Verification": "VERIFIED", "Attribution / status": "Russian state aircraft; hostile intent not established"}, {"Incident ID": "REG-641", "date": "2026-06-03", "Event / campaign": "Russian SU24MR aircraft triggered NATO identification", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-MIL-CONVENTIONAL", "Short description": "On June 3 NATO fighter aircraft responded to one SU24MR flying via international airspace from mainland Russia to Kaliningrad. Its onboard transponder was switched oﬀ, the crew had no pre-filed flight plan and was not maintaining radio communication.", "Key source": "Lithuanian Ministry of National Defence (KAM), KAM_Interceptions_2026.pdf, p. 24", "Verification": "VERIFIED", "Attribution / status": "Russian state aircraft; hostile intent not established"}, {"Incident ID": "REG-642", "date": "2026-06-04", "Event / campaign": "Multiple Russian/suspected Russian aircraft triggered NATO scrambles", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-MIL-CONVENTIONAL", "Short description": "NATO fighter jets were scrambled several times in response to Russian or suspected Russian aircraft activity near the Baltic states.", "Key source": "SAHASEC / Lithuanian Ministry of Defence", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_DOCUMENTED"}, {"Incident ID": "REG-643", "date": "2026-06-05", "Event / campaign": "Russian IL-78, AN-72, IL-76 aircraft triggered NATO interception", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-MIL-CONVENTIONAL", "Short description": "On June 5 aircraft of the NATO Air Policing Detachment were dispatched to intercept one IL-78 flying from the mainland Russia to Kaliningrad with its onboard transponder switched on, without the flight plan, but maintain radio communication with the regional air traﬃc control centre. NATO fighter jets also intercepted one AN-72 flying through international airspace from mainland Russia to Kaliningrad, without the flight plan, but with its onboard transponder switched on and maintaining radio communication with the regional air traﬃc control. On the same scramble, one IL-76 was also identified and escorted. The aircraft was flying from Kaliningrad to mainland Russia, without the flight plan, with its onboard transponder switched on, and maintaining radio communication.", "Key source": "Lithuanian Ministry of National Defence (KAM), KAM_Interceptions_2026.pdf, p. 20", "Verification": "VERIFIED", "Attribution / status": "Russian state aircraft; hostile intent not established"}, {"Incident ID": "RE itched oﬀ, the crews had no flight plans and were not maintaining radio communication with the regional air traﬃc control centre.", "Key source": "Lithuanian Ministry of National Defence (KAM), KAM_Interceptions_2026.pdf, p. 22", "Verification": "VERIFIED", "Attribution / status": "Russian state aircraft; hostile intent not established"}, {"Incident ID": "REG-654", "date": "2026-06-22", "Event / campaign": "Russian SU-30SM, TU-154 aircraft triggered NATO interception", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-MIL-CONVENTIONAL", "Short description": "On June 22 NATO fighter aircraft were scrambled in response to two SU-30SM flying from and back to Kaliningrad via international airspace with their onboard transponders switched oﬀ, without the flight plans and without maintaining radio communication with the regional air traﬃc control centre. While on the same mission, one TU-154 was also intercepted on the way from Kaliningrad to mainland Russia, via international airspace, its onboard transponder switched on, adhering to a pre-filed flight plan and maintaining radio communication.", "Key source": "Lithuanian Ministry of National Defence (KAM), KAM_Interceptions_2026.pdf, p. 23", "Verification": "VERIFIED", "Attribution / status": "Russian state aircraft; hostile intent not established"}, {"Incident ID": "REG-655", "date": "2026-06-23", "Event / campaign": "Russian IL-18 aircraft triggered NATO identification/escort", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-MIL-CONVENTIONAL", "Short description": "On June 23 NATO fighter jets identified and escorted one IL-18 flying through international airspace from mainland Russia to Kaliningrad. Its onboard transponder was switched on, the crew was maintaining radio communication and had the flight plan.", "Key source": "Lithuanian Ministry of National Defence (KAM), KAM_Interceptions_2026.pdf, p. 23", "Verification": "VERIFIED", "Attribution / status": "Russian state aircraft; hostile intent not established"}, {"Inci const SHEETS = ["Estonia","Latvia","Lithuania","Regional"];
let current = SHEETS[0];
function render() {
  const rows = DATA[current] || [];
  const cols = rows.length ? Object.keys(rows[0]) : [];
  document.getElementById("thead").innerHTML =
    "<tr>" + cols.map(c => "<th>"+escapeHtml(c)+"</th>").join("") + "</tr>";
  document.getElementById("tbody").innerHTML = rows.map(r =>
    "<tr>" + cols.map(c => "<td>"+escapeHtml(r[c])+"</td>").join("") + "</tr>"
  ).join("");
  document.querySelectorAll(".tabs button").forEach(b =>
    b.classList.toggle("active", b.dataset.sheet === current)
  );
}
function escapeHtml(x) {
  return String(x ?? "").replace(/[&<>"']/g, m =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"})[m]
  );
}
document.getElementById("tabs").innerHTML = SHEETS.map(s =>
  "<button data-sheet='"+s+"' onclick=\"current='"+s+"';render()\">"+s+"</button>"
).join("");
render();
</script>
