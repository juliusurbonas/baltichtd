r and mistrust.", "Key source": "Prosecutor’s Office", "Verification": "CONFIRMED", "Attribution / status": "GRU-directed sabotage established by court proceedings"}, {"Incident ID": "EE-047", "date": "2025-03-01", "Event / campaign": "Ivan Dmitrijev FSB recruitment and intelligence activity", "JRC/HT classification(s)": "HT-ESPIONAGE; HT-RECRUITMENT; JRC-INFILTRATION", "Short description": "An Estonian Defence League member cooperated with an FSB Border Service officer from March to May 2025, supplying information about Defence League personnel, Narva and defence activity.", "Key source": "KAPO / Prosecutor’s Office", "Verification": "CONFIRMED", "Attribution / status": "FSB-directed recruitment and intelligence activity established"}, {"Incident ID": "EE-048", "date": "2025-05-20", "Event / campaign": "Stanislav Matlak FSB cooperation case", "JRC/HT classification(s)": "HT-ESPIONAGE; HT-RECRUITMENT", "Short description": "KAPO established covert cooperation between Ukrainian citizen Stanislav Matlak and the FSB beginning in 2023; his residence permit was revoked and he was expelled to Ukraine in May 2025.", "Key source": "KAPO", "Verification": "CONFIRMED", "Attribution / status": "FSB cooperation established; operational activity included provision of SIM cards used in other FSB operations"}, {"Incident ID": "EE-049", "date": "2025-07-26", "Event / campaign": "Russian Coast Guard vessel entered Estonian territorial waters", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-MIL-CONVENTIONAL; JRC-LEGAL-THRESHOLDS", "Short description": "A Russian border-guard vessel entered Estonian territorial waters without permission.", "Key source": "Priming / Estonian authorities", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_DOCUMENTED"}, {"Incident ID": "EE-050", "date": "2025-08-24", "Event / campaign": "Ukrainian-origin FP1 drone crashes in Aakre, Tartu County", "JRC/HT classification(s)": "HT-DRONE; JRC-AIRSPACE; JRC-ELECTRONIC-GNSS", "Short description":  / campaign": "Drones near the Reedo military base", "JRC/HT classification(s)": "HT-DRONE; JRC-AIRSPACE; JRC-INTEL-PREP", "Short description": "Two small UAVs operated near the Reedo Barracks; one was shot down. Estonian authorities suspected a reconnaissance purpose.", "Key source": "Priming / Estonian Defence Forces", "Verification": "PROBABLE", "Attribution / status": "SUSPECTED_OR_ALLEGED"}, {"Incident ID": "EE-055", "date": "2025-11-02", "Event / campaign": "Russian border-guard cutter displayed a Wagner flag on the Narva River", "JRC/HT classification(s)": "JRC-CONFUSING-NARRATIVE; JRC-SOCIO-CLEAVAGES; JRC-MIL-CONVENTIONAL", "Short description": "A Russian border-guard cutter displaying a Wagner Group flag sailed on the Narva River.", "Key source": "Estonian Ministry of Foreign Affairs", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_DOCUMENTED"}, {"Incident ID": "EE-056", "date": "2025-11-09", "Event / campaign": "False bomb threats against Tallinn schools", "JRC/HT classification(s)": "HT-FIMI; HT-THREAT-WARNING; JRC-CONFUSING-NARRATIVE; JRC-SOCIAL-UNREST", "Short description": "Several Tallinn schools received bomb threats resembling the earlier Baltic-wide false-threat campaign; the episode was treated as a suspected Russian hybrid operation.", "Key source": "Priming / Destabilizing / Coercing — Estonia", "Verification": "PROBABLE", "Attribution / status": "SUSPECTED_OR_ALLEGED"}, {"Incident ID": "EE-057", "date": "2025-12-17", "Event / campaign": "Three Russian border guards crossed into Estonian territory by hovercraft", "JRC/HT classification(s)": "HT-BORDER; JRC-MIL-CONVENTIONAL; JRC-LEGAL-THRESHOLDS", "Short description": "Three Russian border guards disembarked from a hovercraft and crossed the temporary control line onto Estonian territory at Vasknarva.", "Key source": "Estonian Ministry of Foreign Affairs", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_DOCUMENTED"}, {"Incident ID": "EE-058", "date": "2025-12-31", ion": "Multiple drones entered Estonian airspace during Ukrainian strikes on Russia, triggering air-threat alerts; one crashed in Kastre municipality.", "Key source": "Estonian Defence Forces / KAPO Annual Review 2025–2026", "Verification": "CONFIRMED", "Attribution / status": "Likely Ukrainian-origin spillover; diversion by Russian electronic warfare assessed as likely"}, {"Incident ID": "EE-062", "date": "2026-05-19", "Event / campaign": "UAV enters Estonia from Russian airspace and is shot down", "JRC/HT classification(s)": "HT-DRONE; JRC-AIRSPACE; JRC-ELECTRONIC-GNSS", "Short description": "A UAV entered Estonian airspace from Russian airspace and was shot down by a Romanian F-16. The UAV was likely Ukrainian-origin; the incident occurred amid heavy Russian GPS spoofing and jamming.", "Key source": "Estonian Defence Forces", "Verification": "CONFIRMED", "Attribution / status": "UAV likely Ukrainian; Russian electronic warfare conditions confirmed; deliberate Russian targeting not established"}, {"Incident ID": "EE-063", "date": "2026-05-20", "Event / campaign": "NATO scramble to identify unidentified aerial target over Estonian airspace", "JRC/HT classification(s)": "JRC-AIRSPACE", "Short description": "On May 20 NATO fighter aircraft were dispatched to identify a potential air target in Estonia.", "Key source": "Lithuanian Ministry of National Defence (KAM), KAM_Interceptions_2026.pdf, p. 18", "Verification": "VERIFIED", "Attribution / status": "Unknown aerial target; attribution not established"}, {"Incident ID": "EE-064", "date": "2026-06-03", "Event / campaign": "Attack drone crosses into Estonia and crashes in Rõuge County", "JRC/HT classification(s)": "HT-DRONE; JRC-AIRSPACE", "Short description": "An attack drone carrying about five kilograms of explosives was found in Rõuge County; KAPO assessed it was likely one of the drones detected entering Estonia during Ukrainian strikes on Russia on 3 June.", "Key source": "ERR citing KAPO", "Verification": "CONFIRMED", "Attribution / status": "Ukrainian strike spillover assessed; no evidence Estonia was intended target"}, {"Incident ID": "EE-065", "date": "2026-08-15", "Event / campaign": "Suspected arson at Milrem Robotics facility in Tallinn", "JRC/HT classification(s)": "HT-SABOTAGE; JRC-INFRA-PHYSICAL", "Short description": "A building used by Milrem Robotics caught fire; prosecutors said initial evidence indicated possible arson and suspects had been identified, while potential sabotage motives were still being investigated.", "Key source": "Prosecutor’s Office", "Verification": "CONFIRMED", "Attribution / status": "Possible arson confirmed; sabotage motive and Russian involvement unresolved"}, {"Incident ID": "EE-066", "date": "2026-08-27", "Event / campaign": "Nikita Kuzmin GRU recruitment and intelligence activity", "JRC/HT classification(s)": "HT-ESPIONAGE; HT-RECRUITMENT; JRC-INFILTRATION", "Short description": "A dual Estonian-Russian citizen was convicted after establishing a relationship with a GRU officer while in Russia and collecting information on military and civilian objects around Narva.", "Key source": "Prosecutor’s Office", "Verification": "CONFIRMED", "Attribution / status": "GRU recruitment and intelligence activity; relationship established by 2024 at latest"}, {"Incident ID": "EE-067", "date": "2026-09-01", "Event / campaign": "UAV incursions trigger nationwide Estonian air-threat warnings", "JRC/HT classification(s)": "HT-DRONE; JRC-AIRSPACE", "Short description": "Drones moved along Estonia’s eastern border; one crossed into southeastern Estonian airspace and another approached Narva before turning back. NATO fighters were scrambled and public air-threat alerts were issued across several counties.", "Key source": "ERR / Estonian Defence Forces", "Verification": "CONFIRMED", "Attribution / status": "Likely Ukrainian-war spillover; Russian deliberate targeting not established"}], "Latvia": [{"Incident ID": "LV-001", "date": "2022-04-01", "Event / campaign": "Russian-aligned Killnet DDoS campaign against Latvian state websites", "JRC/HT classification(s)": "JRC-CYBER-OPS", "Short description": "CERT.LV reported large DDoS attacks against multiple Latvian state institutions; attacks were claimed by Killnet and caused temporary service disruption.", "Key source": "CERT.LV", "Verification": "CONFIRMED", "Attribution / status": "Russian-aligned hacktivist campaign; attribution to Killnet documented"}, {"Incident ID": "LV-002", "date": "2022-05-01", "Event / campaign": "Killnet DDoS wave against Latvian public and private services", "JRC/HT classification(s)": "JRC-CYBER-OPS", "Short description": "Several dozen large DDoS attacks targeted state institutions, state-owned companies, media, finance and businesses. Ziedot.lv, inbox.lv and Mobilly experienced service disruption.", "Key source": "CERT.LV", "Verification": "CONFIRMED", "Attribution / status": "Killnet publicly claimed most attacks; pro-Russian hacktivist activity"}, {"Incident ID": "LV-003", "date": "2022-05-01", "Event / campaign": "Russian Operation Doppelganger influence campaign affecting Latvia", "JRC/HT classification(s)": "HT-FIMI; JRC-DISINFO-PROPAGANDA; JRC-MEDIA-INTERFERENCE; JRC-CONFUSING-NARRATIVE", "Short description": "The Doppelganger operation used cloned media websites and related online assets; Latvia was identified among the countries where the operation was observed.", "Key source": "EU DisinfoLab", "Verification": "VERIFIED", "Attribution / status": "SUSPECTED_OR_ALLEGED"}, {"Incident ID": "LV-004", "date": "2022-06-01", "Event / campaign": "Russian hacktivist DDoS wave; Passenger Train services disrupted", "JRC/HT classification(s)": "JRC-CYBER-OPS; HT-THREAT-WARNING", "Short description": "At least 30 Latvian websites were attacked in early June; Passenger Train website/app was disrupted for several hours, affecting online ticket purchases.", "Key source": "CERT.LV", "Verification": "CONFIRMED", "Attribution / status": "Killnet claimed responsibility; Russian-aligned hacktivists"}, {"Incident ID": "LV-005", "date": "2022-07-01", "Event / campaign": "DDoS attacks against Latvian presidency, defence and state resources", "JRC/HT classification(s)": "JRC-CYBER-OPS", "Short description": "Latvian President's Chancellery, likumi.lv, CERT.LV, Defence Ministry, KNAB, covid19.gov.lv and other state/transport/media targets faced intensified DDoS attacks.", "Key source": "CERT.LV", "Verification": "CONFIRMED", "Attribution / status": "Associated with Russian-aggression-supporting hacktivists"}, {"Incident ID": "LV-006", "date": "2022-07-30", "Event / campaign": "VDD detention over pro-Russian propaganda and sanctions violations", "JRC/HT classification(s)": "HT-FIMI; JRC-DISINFO-PROPAGANDA; JRC-SUPPORT-POLITICAL", "Short description": "VDD detained a person suspected of publicly justifying Russia's war and disseminating material discrediting Latvia and allies, alongside alleged sanctions violations.", "Key source": "VDD", "Verification": "CONFIRMED", "Attribution / status": "Proceedings initiated; guilt not established at detention"}, {"Incident ID": "LV-007", "date": "2022-08-11", "Event / campaign": "DDoS escalation after Saeima designation of Russia as terrorism-supporting state", "JRC/HT classification(s)": "JRC-CYBER-OPS; JRC-COERCE-GOV", "Short description": "CERT.LV and VDD recorded exceptionally intense cyberattack activity around Latvia's political decisions; the August wave followed the Saeima decision on 11 August.", "Key source": "CERT.LV", "Verification": "CONFIRMED", "Attribution / status": "Russian-aligned hacktivists"}, {"Incident ID": "LV-008", "date": "2022-08-25", "Event / campaign": "DDoS attacks during removal of Soviet Victory monument", "JRC/HT classification(s)": "JRC-CYBER-OPS; JRC-COERCE-GOV", "Short description": "On the monument demolition day, DDoS attacks targeted VDD, Interior Ministry and National Health Service resources; Passenger Train's site was also attacked and ticket sales briefly disrupted.", "Key source": "CERT.LV", "Verification": "CONFIRMED", "Attribution / status": "Russian-aligned hacktivist activity"}, {"Incident ID": "LV-009", "date": "2022-11-01", "Event / campaign": "Escalation of Belarus-linked instrumentalised migration at Latvia–Belarus border", "JRC/HT classification(s)": "HT-BORDER; JRC-MIG-DISCOURSE; JRC-IMMIGRATION-POLITICAL", "Short description": "Latvia recorded a sharp increase in attempted illegal crossings from late 2022: 429 in November and 1,053 in December 2022. The government subsequently extended a border state of emergency citing Belarusian hybrid attacks.", "Key source": "Latvian Cabinet", "Verification": "CONFIRMED", "Attribution / status": "Latvian authorities explicitly characterised the broader pressure as Belarusian hybrid activity"}, {"Incident ID": "LV-010", "date": "2022-11-28", "Event / campaign": "VDD opens criminal case over pro-Kremlin 'Baltic anti-fascists' network", "JRC/HT classification(s)": "HT-FIMI; JRC-DISINFO-PROPAGANDA; JRC-DISCREDIT-LEADERS; JRC-INTEL-PREP", "Short description": "VDD said Telegram channels collected sensitive information on Latvian officials and public figures, with stated intent to pass it to Russian intelligence and use it to pressure people opposing Russia's war.", "Key source": "VDD", "Verification": "CONFIRMED", "Attribution / status": "VDD attributed activity to Russia-linked Latvian nationals"}, {"Incident ID": "LV-011", "date": "2023-02-06", "Event / campaign": "VDD detains administrator of 'Baltic anti-fascists'", "JRC/HT classification(s)": "HT-FIMI; JRC-DISINFO-PROPAGANDA; JRC-SUPPORT-POLITICAL", "Short description": "VDD detained an administrator/moderator of the Telegram network suspected of systematic propaganda and influence activity against Latvia on behalf of Russia.", "Key source": "VDD", "Verification": "CONFIRMED", "Attribution / status": "Investigation; guilt not established"}, {"Incident ID": "LV-012", "date": "2023-05-31", "Event / cam 2022; VSD assessed that intelligence activity continued through other channels.", "Key source": "VSD 2022 activity report", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_DOCUMENTED"}, {"Incident ID": "LT-004", "date": "2022-04-14", "Event / campaign": "Russian and Belarusian intelligence recruitment of Lithuanians travelling to Russia/Belarus", "JRC/HT classification(s)": "HT-RECRUITMENT; HT-ESPIONAGE; JRC-INTEL-PREP", "Short description": "VSD warned that hostile intelligence services increasingly approached Lithuanian citizens while they were in Russia or Belarus, using questioning, pressure and recruitment attempts.", "Key source": "VSD, 14 April 2022", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_ASSESSED"}, {"Incident ID": "LT-005", "date": "2022-06-27", "Event / campaign": "Killnet-linked / pro-Russian DDoS campaign against Lithuanian institutions and companies", "JRC/HT classification(s)": "JRC-CYBER-OPS; JRC-CYBER-ESPIONAGE", "Short description": "Intensive distributed denial-of-service attacks disrupted Lithuania's secure government data network, public institutions and private companies. NKSC warned of further attacks.", "Key source": "Lithuanian National Cyber Security Centre", "Verification": "VERIFIED", "Attribution / status": "SUSPECTED_OR_ALLEGED"}, {"Incident ID": "LT-006", "date": "2022-07-07", "Event / campaign": "Cyberattack against Lithuania’s Ignitis Group", "JRC/HT classification(s)": "JRC-CYBER-OPS; JRC-INFRA-DEPENDENCY", "Short description": "Ignitis Group, Lithuania’s state-owned energy company, suffered a major cyberattack reported by the Lithuanian National Cyber Security Centre and media.", "Key source": "SAHASEC", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_DOCUMENTED"}, {"Incident ID": "LT-007", "date": "2022-08-01", "Event / campaign": "FSB detention and interrogation of a Lithuanian citizen after accidental Russian border crossing", "JRC/HT classification(s)": "HT-ESPIONAGE; JRC-INTEL-PREP; JRC-CLANDESTINE", "Short description": "A Lithuanian citizen who accidentally entered Russia's border zone was detained, interrogated and subjected to device searches and questioning about contacts with Lithuanian security institutions.", "Key source": "VSD National Threat Assessment 2023", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_ASSESSED"}, {"Incident ID": "LT-008", "date": "2022-09-14", "Event / campaign": "Russian/Belarusian coercive intelligence activity against Lithuanian citizens in Russia and Belarus", "JRC/HT classification(s)": "HT-RECRUITMENT; HT-ESPIONAGE; JRC-CLANDESTINE", "Short description": "VSD publicised cases in which Lithuanian citizens abroad became targets for recruitment, coercion and intelligence tasks, including surveillance of strategic infrastructure and propaganda support.", "Key source": "VSD, 14 September 2022", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_ASSESSED"}, {"Incident ID": "LT-009", "date": "2023-01-01", "Event / campaign": "Russian intelligence shift toward recruiting socially vulnerable people for physical operations", "JRC/HT classification(s)": "HT-RECRUITMENT; JRC-CLANDESTINE; JRC-INTEL-PREP", "Short description": "VSD assessed that Russian intelligence had begun using recruitment channels to identify people willing to collect information and potentially perform sabotage or other criminal tasks.", "Key source": "VSD threat reporting", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_ASSESSED"}, {"Incident ID": "LT-010", "date": "2023-03-01", "Event / campaign": "Belarusian intelligence activity at Lithuania–Belarus border", "JRC/HT classification(s)": "HT-ESPIONAGE; HT-RECRUITMENT; JRC-INTEL-PREP", "Short description": "Belarusian intelligence intensified questioning of Lithuanians crossing the border, inspected phones/computers and sought information on political views, workplaces and contacts with security officials.", "Key source": "VSD, 27 June 2023", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_ASSESSED"}, {"Incident ID": "LT-011", "date": "2023-05-01", "Event / campaign": "Vandalism of a Lithuanian anti-Soviet resistance memorial in Bielėnai", "JRC/HT classification(s)": "HT-SABOTAGE; JRC-SOCIO-CLEAVAGES; JRC-DISINFO-PROPAGANDA", "Short description": "A memorial to Adolfas Ramanauskas-Vanagas in Bielėnai was vandalised with paint in May 2023; attribution was unresolved at the time.", "Key source": "LRT", "Verification": "PROBABLE", "Attribution / status": "UNKNOWN"}, {"Incident ID": "LT-012", "date": "2023-05-29", "Event / campaign": "NoName057(16) DDoS attacks on Lithuanian government, energy and private-sector websites", "JRC/HT classification(s)": "JRC-CYBER-OPS", "Short description": "A concentrated cyberattack wave hit the Lithuanian Parliament, Litgrid, Linas Agro, Kauno Energija and the Lithuanian Riflemen's Union.", "Key source": "NKSC CTAC Q2 2023 report", "Verification": "VERIFIED", "Attribution / status": "ATTRIBUTED_BY_CYBER_AUTHORITIES"}, {"Incident ID": "LT-013", "date": "2023-06-28", "Event / campaign": "Wagner-linked fabricated Prigozhin visit narrative against Lithuania", "JRC/HT classification(s)": "HT-FIMI; JRC-DISINFO-PROPAGANDA; JRC-CONFUSING-NARRATIVE; JRC-SUPPORT-POLITICAL", "Short description": "VSD found documents at a Wagner office indicating that a Prigozhin double had been used in a fabricated 2020 Vilnius visit story intended to undermine trust in Lithuanian institutions and sanctions enforcement.", "Key source": "VSD, 28 June 2023", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_ASSESSED"}, {"Incident ID": "LT-014", "date": "2023-10-13", "Event / campaign": "Coordinated mass false bomb-threat campaign against Lithuanian schools", "JRC/HT classification(s)": "HT-FIMI; JRC-CONFUSING-NARRATIVE; JRC-SOCIAL-UNREST", "Short description": "Thousands of Russian-language emails threatened schools, kindergartens and other institutions with bombs. Lithuanian authorities treated the episode as a coordinated hostile operation aimed at panic and disruption.", "Key source": "LRT/BNS reporting on police and VSD assessment", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_ASSESSED"}, {"Incident ID": "LT-015", "date": "2023-10-20", "Event / campaign": "Follow-on copycat school bomb threats after the mass October campaign", "JRC/HT classification(s)": "HT-FIMI; JRC-CONFUSING-NARRATIVE", "Short description": "Additional false threats continued after the main five-day campaign; several later cases were attributed to students copying the tactic, so these are recorded separately as follow-on activity rather than hostile-state incidents.", "Key source": "LRT/BNS reporting on police investigation", "Verification": "PROBABLE", "Attribution / status": "UNKNOWN"}, {"Incident ID": "LT-016", "date": "2023-11-01", "Event / campaign": "Belarusian intelligence espionage cases involving Lithuanian citizens", "JRC/HT classification(s)": "HT-ESPIONAGE; HT-RECRUITMENT; JRC-INTEL-PREP", "Short description": "Two Lithuanian citizens were investigated for collecting and passing information on military and strategic targets to Belarusian military intelligence after establishing contact in Minsk in 2022.", "Key source": "Lithuanian Prosecutor General's Office", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_ESTABLISHED"}, {"Incident ID": "LT-017", "date": "2024-01-01", "Event / campaign": "Belarusian intelligence recruitment of diaspora members in Lithuania", "JRC/HT classification(s)": "HT-RECRUITMENT; HT-ESPIONAGE; JRC-CLANDESTINE", "Short description": "Belarusian intelligence increasingly recruited members of the Belarusian diaspora via messaging apps, using financial inducements and coercion involving family and property in Belarus.", "Key source": "VSD threat reporting", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_ASSESSED"}, {"Incident ID": "LT-018", "date": "2024-01-01", "Event / campaign": "Belarusian intelligence targeting Belarusian opposition and diaspora in Lithuania", "JRC/HT classification(s)": "HT-ESPIONAGE; HT-RECRUITMENT; JRC-INTEL-PREP; JRC-CLANDESTINE", "Short description": "Lithuanian intelligence assessed Belarusian intelligence activity against the Belarusian opposition and growing diaspora in Lithuania as an important and sustained campaign.", "Key source": "VSD 2024 National Threat Assessment", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_ASSESSED"}, {"Incident ID": "LT-019", "date": "2024-01-01", "Event / campaign": "Chinese cyber-espionage and intelligence activity against Lithuanian targets", "JRC/HT classification(s)": "JRC-CYBER-ESPIONAGE; HT-ESPIONAGE; JRC-INTEL-PREP", "Short description": "Lithuanian intelligence reported intensified Chinese intelligence activity against Lithuania, including use of social networks for targeting and expanded cyber-espionage capabilities.", "Key source": "VSD 2024 threat assessment", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_ASSESSED"}, {"Incident ID": "LT-020", "date": "2024-01-01", "Event / campaign": "Russian electronic warfare / GNSS jamming and spoofing affecting Lithuania and Baltic navigation", "JRC/HT classification(s)": "JRC-ELECTRONIC-GNSS; JRC-INFRA-DEPENDENCY", "Short description": "Russia's electronic warfare systems in Kaliningrad generated persistent jamming and spoofing with spillover effects on satellite navigation in Lithuanian territory and Baltic aviation and shipping.", "Key source": "VSD threat assessment", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_ASSESSED"}, {"Incident ID": "LT-021", "date": "2024-01-01", "Event / campaign": "Russian information-psychological operations combining narratives with kinetic provocations", "JRC/HT classification(s)": "HT-FIMI; JRC-DISINFO-PROPAGANDA; JRC-CONFUSING-NARRATIVE; JRC-CLANDESTINE", "Short description": "VSD warned that Kremlin-linked actors increasingly combined information-psychological activity with deliberate legal violations and physical provocations to intimidate society and disrupt institutions.", "Key source": "VSD, May 2024 warning", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_ASSESSED"}, {"Incident ID": "LT-022", "date": "2024-01-19", "Event / campaign": "Major Baltic-region GPS disruption episode", "JRC/HT classification(s)": "JRC-ELECTRONIC-GNSS", "Short description": "A pronounced wave of GPS interference affected the Baltic region and Poland; reporting and regional officials linked the phenomenon to Russian electronic warfare, while noting uncertainty over immediate intent.", "Key source": "LRT / regional reporting", "Verification": "PROBABLE", "Attribution / status": "SUSPECTED_OR_ALLEGED"}, {"Incident ID": "LT-023", "date": "2024-01-22", "Event / campaign": "Three armed Belarusian border guards briefly crossed into Lithuanian territory", "JRC/HT classification(s)": "HT-BORDER; JRC-AIRSPACE; JRC-LEGAL-THRESHOLDS", "Short description": "Three armed Belarusian border guards crossed about 2.5 metres into Lithuania and walked roughly 400 metres before returning to Belarus. Lithuania issued a diplomatic protest.", "Key source": "Lithuanian Ministry of Foreign Affairs", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_DOCUMENTED"}, {"Incident ID": "LT-024", "date": "2024-01-29", "Event / campaign": "GRU-directed vandalism of the Adolfas Ramanauskas-Vanagas monument in Merkinė", "JRC/HT classification(s)": "HT-SABOTAGE; JRC-INFRA-PHYSICAL; JRC-SOCIO-CLEAVAGES; JRC-CLANDESTINE", "Short description": "The Merkinė monument to partisan leader Adolfas Ramanauskas-Vanagas was splashed with paint; Lithuanian prosecutors later alleged the act was ordered by Russian military intelligence.", "Key source": "LRT / Lithuanian prosecutors", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_ESTABLISHED"}, {"Incident ID": "LT-025", "date": "2024-03-12", "Event / campaign": "Leonid Volkov attacked outside his Vilnius home; suspects later detained", "JRC/HT classification(s)": "HT-SABOTAGE; JRC-CLANDESTINE; JRC-SUPPORT-POLITICAL", "Short description": "Russian opposition figure Leonid Volkov was attacked with gas and a hammer outside his Vilnius home. Lithuanian prosecutors later arrested two Polish nationals suspected of carrying out the assault.", "Key source": "Lithuanian Prosecutor General's Office", "Verification": "VERIFIED", "Attribution / status": "RUSSIAN_LINK_LATER_INVESTIGATED"}, {"Incident ID": "LT-026", "date": "2024-05-09", "Event / campaign": "IKEA Vilnius arson linked to Russian military/security interests", "JRC/HT classification(s)": "HT-SABOTAGE; JRC-INFRA-PHYSICAL; JRC-CLANDESTINE; HT-RECRUITMENT", "Short description": "The Vilnius IKEA fire was later reconstructed by prosecutors as part of a covert terrorist operation conducted in the interests of Russian military and security structures, with recruited operatives and advance reconnaissance.", "Key source": "Lithuanian Prosecutor General's Office", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_ESTABLISHED"}, {"Incident ID": "LT-027", "date": "2024-05-20", "Event / campaign": "Repeated Russian military aviation rule violations in international airspace adjacent to Lithuania", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-INTEL-PREP", "Short description": "NATO Baltic Air Policing repeatedly intercepted Russian aircraft operating without flight plans, with transponders off and/or without radio contact in international airspace near the Baltic states.", "Key source": "Lithuanian Ministry of National Defence", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_DOCUMENTED"}, {"Incident ID": "LT-028", "date": "2024-05-31", "Event / campaign": "Pegasus spyware targeting Russian and Belarusian opposition figures in Vilnius", "JRC/HT classification(s)": "JRC-CYBER-ESPIONAGE; HT-ESPIONAGE", "Short description": "An independent Russian journalist and Belarusian civil-society member in Vilnius were among Russian/Belarusian opposition-linked people targeted with Pegasus spyware.", "Key source": "LRT reporting on Access Now / Citizen Lab research", "Verification": "VERIFIED", "Attribution / status": "SUSPECTED_OR_ALLEGED"}, {"Incident ID": "LT-029", "date": "2024-06-30", "Event / campaign": "Russian Pobeda passenger aircraft briefly entered Lithuanian airspace", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-LEGAL-THRESHOLDS", "Short description": "A Pobeda flight from Moscow to Kaliningrad entered Lithuanian airspace over the Baltic Sea for about one minute. Lithuania summoned the Russian embassy and protested.", "Key source": "Lithuanian Ministry of Foreign Affairs", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_DOCUMENTED"}, {"Incident ID": "LT-030", "date": "2024-07-19", "Event / campaign": "Vilnius-originated incendiary parcel campaign against European targets", "JRC/HT classification(s)": "HT-SABOTAGE; JRC-CLANDESTINE; HT-RECRUITMENT", "Short description": "Four incendiary devices were dispatched from Vilnius toward European destinations; three detonated or ignited in Germany, Poland and the UK. Lithuanian prosecutors later linked organisers to Russian military-intelligence structures.", "Key source": "Lithuanian Prosecutor General's Office", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_ESTABLISHED"}, {"Incident ID": "LT-031", "date": "2024-08-01", "Event / campaign": "Belarusian detention and coercive use of a Lithuanian citizen for propaganda", "JRC/HT classification(s)": "HT-ESPIONAGE; HT-RECRUITMENT; HT-FIMI; JRC-DISINFO-PROPAGANDA; JRC-COERCE-GOV", "Short description": "A Lithuanian citizen detained in Belarus was reportedly pressured by the KGB to participate in propaganda interviews, discredit Lithuania and provoke Lithuanian institutions.", "Key source": "VSD 2026 threat reporting", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_ASSESSED"}, {"Incident ID": "LT-032", "date": "2024-09-03", "Event / campaign": "Fraudulent calls impersonating Lithuania's Migration Department targeting Belarusians", "JRC/HT classification(s)": "HT-FIMI; JRC-INTEL-PREP; JRC-CLANDESTINE", "Short description": "Callers impersonated Lithuanian Migration Department officials, questioned Belarusian citizens about democratic-opposition activity and attempted to collect information.", "Key source": "VSD warning", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_ASSESSED"}, {"Incident ID": "LT-033", "date": "2024-09-17", "Event / campaign": "First attempted arson attack against TVC Solutions in Šiauliai", "JRC/HT classification(s)": "HT-SABOTAGE; JRC-INFRA-PHYSICAL; JRC-CLANDESTINE; JRC-SUPPORT-POLITICAL", "Short description": "Two foreign nationals attempted to ignite mobile radio-spectrum analysis stations intended for Ukraine; they abandoned the attempt after being disturbed and later fled to Latvia.", "Key source": "Lithuanian Prosecutor General’s Office", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_ESTABLISHED"}, {"Incident ID": "LT-034", "date": "2024-09-22", "Event / campaign": "Second attempted arson attack against TVC Solutions in Šiauliai", "JRC/HT classification(s)": "HT-SABOTAGE; JRC-INFRA-PHYSICAL; JRC-CLANDESTINE; JRC-SUPPORT-POLITICAL", "Short description": "A second group attempted to burn TVC Solutions equipment intended for Ukraine; the incendiary materials ignited but failed to damage the targeted equipment.", "Key source": "Lithuanian Prosecutor General’s Office", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_ESTABLISHED"}, {"Incident ID": "LT-035", "date": "2024-09-28", "Event / campaign": "Contraband balloon carrying cigarettes landed inside Vilnius Airport", "JRC/HT classification(s)": "HT-BALLOON; JRC-AIRSPACE; HT-AIRPORT-DISRUPTION", "Short description": "At 23:45 a contraband balloon carrying cigarettes landed inside the territory of Vilnius Airport. This was an early concrete precursor to the much larger 2025 airport-disruption campaign.", "Key source": "LRT chronology / Lithuanian Airports", "Verification": "VERIFIED", "Attribution / status": "ORGANISED_SMUGGLING; HYBRID_RELEVANCE_LATER_ESTABLISHED"}, {"Incident ID": "LT-036", "date": "2024-10-09", "Event / campaign": "Contraband balloon struck a car and Vilnius shopping centre", "JRC/HT classification(s)": "HT-BALLOON; JRC-AIRSPACE; JRC-INFRA-PHYSICAL", "Short description": "A contraband balloon came down in central Vilnius, struck a car, hit the facade of the CUP shopping centre and landed on a terrace.", "Key source": "LRT chronology", "Verification": "VERIFIED", "Attribution / status": "ORGANISED_SMUGGLING"}, {"Incident ID": "LT-037", "date": "2024-11-02", "Event / campaign": "NATO scramble identifies aerial target as birds over Lithuanian airspace", "JRC/HT classification(s)": "JRC-AIRSPACE", "Short description": "On November 2 NATO fighter aircraft were scrambled to determine the nature of an identified aerial target breaching into Lithuania’s territory from Latvia. The target proved to be a sizable flock of birds.", "Key source": "Lithuanian Ministry of National Defence (KAM), KAM_Interceptions_2024.pdf, p. 44", "Verification": "VERIFIED", "Attribution / status": "No hostile actor; target identified as birds"}, {"Incident ID": "LT-038", "date": "2024-11-17", "Event / campaign": "Damage to Lithuania-Sweden undersea telecommunications cable", "JRC/HT classification(s)": "JRC-INFRA-PHYSICAL; JRC-INFRA-DEPENDENCY", "Short description": "Cables connecting Lithuania with Sweden were among undersea infrastructure damaged in the Baltic Sea on 17–18 November. Lithuania subsequently joined international efforts to strengthen undersea cable security; the responsible actor was not established publicly.", "Key source": "Lithuanian Ministry of Foreign Affairs", "Verification": "VERIFIED", "Attribution / status": "ATTRIBUTION_UNRESOLVED"}, {"Incident ID": "LT-039", "date": "2025-01-01", "Event / campaign": "Belarusian/Russian information campaign around Belarusian diaspora tensions in Lithuania", "JRC/HT classification(s)": "HT-FIMI; JRC-SOCIO-CLEAVAGES; JRC-DISINFO-PROPAGANDA; JRC-CONFUSING-NARRATIVE", "Short description": "Staged vandalism, threats, provocative graffiti and social-media material were used to create an impression of conflict between Lithuanians and the Belarusian diaspora.", "Key source": "VSD 2025 disclosure", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_ASSESSED"}, {"Incident ID": "LT-040", "date": "2025-01-01", "Event / campaign": "Russian cyber-espionage against Lithuanian government, armed forces and critical infrastructure", "JRC/HT classification(s)": "JRC-CYBER-ESPIONAGE; JRC-CYBER-OPS", "Short description": "VSD assessed Russian cyber-espionage as a continuing threat to Lithuanian state institutions, armed forces and critical infrastructure.", "Key source": "VSD National Threat Assessment 2026", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_ASSESSED"}, {"Incident ID": "LT-041", "date": "2025-01-01", "Event / campaign": "Russian/Belarusian recruitment of right-wing extremists in Lithuania", "JRC/HT classification(s)": "HT-RECRUITMENT; JRC-SOCIO-CLEAVAGES; JRC-CLANDESTINE", "Short description": "VSD assessed that Russian or Belarusian intelligence services attempted to recruit right-wing extremists through social networks to conduct attacks against Belarusians and collect intelligence.", "Key source": "VSD threat reporting", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_ASSESSED"}, {"Incident ID": "LT-042", "date": "2025-01-01", "Event / campaign": "Secondary migration route through Latvia into Lithuania", "JRC/HT classification(s)": "JRC-MIG-BARGAIN; HT-BORDER", "Short description": "Lithuanian border authorities recorded a more than twofold increase in secondary migration from Latvia in 2025; many migrants had travelled through Russia and Belarus before entering Latvia.", "Key source": "VSAT, 6 January 2026", "Verification": "PROBABLE", "Attribution / status": "REGIONAL_PATTERN"}, {"Incident ID": "LT-043", "date": "2025-01-13", "Event / campaign": "Belarusian contraband drone carrying 1,400 cigarette packs downed near the Lithuanian border", "JRC/HT classification(s)": "HT-DRONE; HT-BORDER", "Short description": "VSAT detected a drone carrying a contraband load from Belarus and used anti-drone equipment to disrupt its flight; it crashed into the Nemunas. The load contained 1,400 cigarette packs.", "Key source": "Lithuanian State Border Guard Service", "Verification": "VERIFIED", "Attribution / status": "ORGANISED_SMUGGLING"}, {"Incident ID": "LT-044", "date": "2025-01-16", "Event / campaign": "GPS interference diverted a Ryanair flight bound for Vilnius", "JRC/HT classification(s)": "JRC-ELECTRONIC-GNSS; HT-AIRPORT-DISRUPTION; JRC-INFRA-DEPENDENCY", "Short description": "A Ryanair flight approaching Vilnius aborted its landing and diverted to Warsaw because of GPS signal interference.", "Key source": "SAHASEC / Reuters", "Verification": "VERIFIED", "Attribution / status": "FITTING_THE_PATTERN"}, {"Incident ID": "LT-045", "date": "2025-03-12", "Event / campaign": "Plot to murder political opponents in Vilnius", "JRC/HT classification(s)": "HT-RECRUITMENT; JRC-CLANDESTINE; JRC-SUPPORT-POLITICAL", "Short description": "Lithuanian prosecutors later said a group had surveilled potential victims and planned killings of people selected because of political views and public activity; principal suspects were detained in March 2025.", "Key source": "Lithuanian Prosecutor General's Office", "Verification": "VERIFIED", "Attribution / status": "UNDER_INVESTIGATION"}, {"Incident ID": "LT-046", "date": "2025-04-18", "Event / campaign": "Belarusian attempt to route migrants through Lithuanian border-control points without required documents", "JRC/HT classification(s)": "JRC-MIG-BARGAIN; JRC-IMMIGRATION-POLITICAL; HT-BORDER", "Short description": "Lithuania reported attempts by Belarusian officials to direct migrants toward official border-control points without the documentation required by Schengen rules, treating the tactic as a change in Belarusian hybrid-attack methods.", "Key source": "Lithuanian Interior Ministry", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_CHARACTERISED_AS_HYBRID_ACTIVITY"}, {"Incident ID": "LT-047", "date": "2025-04-23", "Event / campaign": "Russian/Belarusian intelligence operation targeting Belarusian diaspora with staged attacks", "JRC/HT classification(s)": "HT-FIMI; JRC-SOCIO-CLEAVAGES; HT-RECRUITMENT; HT-SABOTAGE; JRC-DISINFO-PROPAGANDA", "Short description": "VSD disclosed an information-psychological operation begun in 2023 that sought to inflame ethnic tension by staging vandalism, threats and attempted violence against Belarusians in Lithuania and portraying Lithuania as xenophobic.", "Key source": "VSD, 23 April 2025", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_ASSESSED"}, {"Incident ID": "LT-048", "date": "2025-07-10", "Event / campaign": "Russian Gerbera UAV entered Lithuanian airspace and crashed", "JRC/HT classification(s)": "HT-DRONE; JRC-AIRSPACE", "Short description": "A Russian Gerbera UAV entered Lithuanian airspace from Belarus and crashed on 10 July. Lithuanian intelligence assessed the entry as accidental.", "Key source": "VSD 2026 National Threat Assessment", "Verification": "VERIFIED", "Attribution / status": "ACCIDENTAL_ENTRY"}, {"Incident ID": "LT-049", "date": "2025-07-19", "Event / campaign": "Russian-linked incendiary parcel attacks exposed as a wider hybrid campaign", "JRC/HT classification(s)": "HT-SABOTAGE; JRC-CLANDESTINE; HT-RECRUITMENT", "Short description": "Lithuanian investigation established that the July 2024 parcel attacks were coordinated by Russian nationals linked to Russian military-intelligence services and involved recruitment of operatives in several countries.", "Key source": "Lithuanian Prosecutor General's Office", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_ESTABLISHED"}, {"Incident ID": "LT-050", "date": "2025-07-28", "Event / campaign": "Second Russian Gerbera UAV entered Lithuanian airspace carrying an explosive charge", "JRC/HT classification(s)": "HT-DRONE; JRC-AIRSPACE", "Short description": "A second Russian Gerbera entered Lithuania from Belarus and crashed on 28 July. It carried a fragmentation/fugitive explosive charge and a more jam-resistant navigation system; VSD assessed the entry as accidental.", "Key source": "VSD 2026 National Threat Assessment", "Verification": "VERIFIED", "Attribution / status": "ACCIDENTAL_ENTRY"}, {"Incident ID": "LT-051", "date": "2025-09-09", "Event / campaign": "Unidentified flying object from Belarus triggered temporary Vilnius Airport closure", "JRC/HT classification(s)": "JRC-AIRSPACE; HT-AIRPORT-DISRUPTION", "Short description": "Lithuanian military radar detected an unidentified object moving from Belarus toward Lithuania. NATO aircraft were scrambled but found no object; preliminary assessment suggested a possible meteorological event.", "Key source": "LRT/BNS", "Verification": "VERIFIED", "Attribution / status": "UNKNOWN; POSSIBLE_METEOROLOGICAL_EVENT"}, {"Incident ID": "LT-052", "date": "2025-09-11", "Event / campaign": "Drone sighting near Vilnius Airport caused flight disruption", "JRC/HT classification(s)": "HT-DRONE; JRC-AIRSPACE; HT-AIRPORT-DISRUPTION", "Short description": "Vilnius Airport operations were temporarily affected after a drone was reported near the airport. The incident formed part of a cluster of airport drone alerts in September before the later balloon campaign.", "Key source": "LRT chronology", "Verification": "PROBABLE", "Attribution / status": "UNKNOWN"}, {"Incident ID": "LT-053", "date": "2025-09-24", "Event / campaign": "GPS disturbance affected Spanish military aircraft bound for Lithuania", "JRC/HT classification(s)": "JRC-ELECTRONIC-GNSS; JRC-INFRA-DEPENDENCY", "Short description": "A Spanish military Airbus A330-MRTT bound for Lithuania encountered GPS disturbance and had to adjust its operations.", "Key source": "SAHASEC / Reuters", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_DOCUMENTED"}, {"Incident ID": "LT-054", "date": "2025-09-25", "Event / campaign": "Second September drone alert near Vilnius Airport", "JRC/HT classification(s)": "HT-DRONE; JRC-AIRSPACE; HT-AIRPORT-DISRUPTION", "Short description": "A second drone-related alert temporarily disrupted Vilnius Airport operations in September 2025.", "Key source": "LRT chronology", "Verification": "PROBABLE", "Attribution / status": "UNKNOWN"}, {"Incident ID": "LT-055", "date": "2025-10-01", "Event / campaign": "Belarusian contraband-balloon campaign causing Lithuanian airspace and airport disruption", "JRC/HT classification(s)": "HT-BALLOON; JRC-AIRSPACE; HT-AIRPORT-DISRUPTION; JRC-ECON-DEPENDENCY", "Short description": "A sustained campaign of contraband balloons launched from Belarus repeatedly entered Lithuanian airspace, disrupting Vilnius airport and civil aviation. Lithuanian authorities describe it as a hybrid attack.", "Key source": "Lithuanian Government hybrid-attack portal", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_CHARACTERISED_AS_HYBRID_ATTACK"}, {"Incident ID": "LT-056", "date": "2025-10-02", "Event / campaign": "GRU sabotage operations identified as targeting Lithuania and Germany", "JRC/HT classification(s)": "HT-SABOTAGE; JRC-CLANDESTINE; JRC-INTEL-PREP", "Short description": "Polish authorities reported evidence that GRU-linked operatives had prepared sabotage operations targeting Lithuania and Germany.", "Key source": "SAHASEC", "Verification": "PROBABLE", "Attribution / status": "OFFICIALLY_ASSESSED"}, {"Incident ID": "LT-057", "date": "2025-10-04", "Event / campaign": "First major 2025 contraband-balloon closure of Vilnius Airport", "JRC/HT classification(s)": "HT-BALLOON; JRC-AIRSPACE; HT-AIRPORT-DISRUPTION", "Short description": "Around 25 balloons entered Lithuanian airspace from Belarus. Vilnius Airport was closed, affecting about 30 flights and 6,000 passengers. Authorities initially said there was no evidence Belarus deliberately intended to disrupt aviation.", "Key source": "Lithuanian Airports / LRT chronology", "Verification": "VERIFIED", "Attribution / status": "BELARUS_ORIGIN; INTENT_UNRESOLVED"}, {"Incident ID": "LT-058", "date": "2025-10-14", "Event / campaign": "Contraband drone carrying 1,000 cigarette packs intercepted in Šalčininkai district", "JRC/HT classification(s)": "HT-DRONE; HT-BORDER", "Short description": "VSAT detected a drone flying from Belarus with a contraband load near Dumblė and used an anti-drone system to bring it down. The device carried 1,000 cigarette packs.", "Key source": "Lithuanian State Border Guard Service", "Verification": "VERIFIED", "Attribution / status": "ORGANISED_SMUGGLING"}, {"Incident ID": "LT-059", "date": "2025-10-21", "Event / campaign": "Large balloon incursion closed Vilnius Airport overnight", "JRC/HT classification(s)": "HT-BALLOON; JRC-AIRSPACE; HT-AIRPORT-DISRUPTION", "Short description": "Dozens of meteorological/contraband balloons entered Lithuania from Belarus. Vilnius Airport closed from the evening of 21 October into 22 October; around 30 flights were affected.", "Key source": "Oro Navigacija / Lithuanian Airports", "Verification": "VERIFIED", "Attribution / status": "BELARUS_ORIGIN"}, {"Incident ID": "LT-060", "date": "2025-10-23", "Event / campaign": "Russian SU-30 and IL-78 military aircraft entered Lithuanian airspace near Kybartai", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-MIL-CONVENTIONAL; JRC-LEGAL-THRESHOLDS", "Short description": "Two Russian military aircraft entered Lithuanian territory near Kybartai to a depth of about 700 metres and remained in Lithuanian airspace for about 18 seconds. Lithuania protested Russia.", "Key source": "Lithuanian Ministry of Foreign Affairs", "Verification": "VERIFIED", "Attribution / status": "RUSSIA; POSSIBLY_ACCIDENTAL"}, {"Incident ID": "LT-061", "date": "2025-10-24", "Event / campaign": "Third major October balloon airport closure; Kaunas Airport also affected", "JRC/HT classification(s)": "HT-BALLOON; JRC-AIRSPACE; HT-AIRPORT-DISRUPTION", "Short description": "Vilnius Airport was closed for the third time during the October campaign and Kaunas Airport was also temporarily closed because of aviation-safety concerns.", "Key source": "LRT chronology", "Verification": "VERIFIED", "Attribution / status": "BELARUS_ORIGIN"}, {"Incident ID": "LT-062", "date": "2025-10-25", "Event / campaign": "Two separate balloon closures of Vilnius Airport in one night", "JRC/HT classification(s)": "HT-BALLOON; JRC-AIRSPACE; HT-AIRPORT-DISRUPTION", "Short description": "Vilnius Airport was repeatedly closed on 25 October as balloon navigation traces approached the airport. One closure lasted from 21:35 until 03:30 and affected about 3,500 passengers and 25 flights.", "Key source": "Lithuanian Airports", "Verification": "VERIFIED", "Attribution / status": "BELARUS_ORIGIN"}, {"Incident ID": "LT-063", "date": "2025-10-26", "Event / campaign": "Balloon swarm triggered another Lithuanian airspace violation and border response", "JRC/HT classification(s)": "HT-BALLOON; JRC-AIRSPACE; HT-AIRPORT-DISRUPTION; JRC-COERCE-GOV", "Short description": "A swarm of meteorological balloons from Belarus again entered Lithuanian airspace, prompting a formal protest and contributing to Lithuania's decision to close the Belarus border.", "Key source": "Lithuanian Ministry of Foreign Affairs", "Verification": "VERIFIED", "Attribution / status": "BELARUS_ORIGIN; LITHUANIA_CHARACTERISED_AS_HYBRID_ATTACK"}, {"Incident ID": "LT-064", "date": "2025-10-29", "Event / campaign": "Belarusian detention of Lithuanian freight vehicles following Lithuania's border closure", "JRC/HT classification(s)": "JRC-ECON-DEPENDENCY; JRC-COERCE-GOV; JRC-LEGAL-THRESHOLDS", "Short description": "After Lithuania temporarily closed the Belarus border amid the contraband-balloon crisis, Belarus retained Lithuanian trucks and trailers, with hundreds remaining stranded and threatened with confiscation.", "Key source": "LRT reporting / Lithuanian Government", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_CHARACTERISED_AS_COERCION"}, {"Incident ID": "LT-065", "date": "2025-10-30", "Event / campaign": "Sixth October closure of Vilnius Airport due to contraband balloons", "JRC/HT classification(s)": "HT-BALLOON; JRC-AIRSPACE; HT-AIRPORT-DISRUPTION", "Short description": "Vilnius Airport was closed again on 30 October because balloons were approaching the airport; the repeated disruption was part of the escalating late-October campaign.", "Key source": "Lithuanian Airports", "Verification": "VERIFIED", "Attribution / status": "BELARUS_ORIGIN"}, {"Incident ID": "LT-066", "date": "2025-11-01", "Event / campaign": "Expansion of Belarusian balloon incursions and airport disruption", "JRC/HT classification(s)": "HT-BALLOON; JRC-AIRSPACE; HT-AIRPORT-DISRUPTION", "Short description": "Lithuanian authorities recorded hundreds of smuggling-balloon incidents and associated flight disruptions, including repeated airport closures and large passenger impacts.", "Key source": "Lithuanian Interior Ministry", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_CHARACTERISED_AS_HYBRID_ATTACK"}, {"Incident ID": "LT-067", "date": "2025-11-05", "Event / campaign": "NATO scramble to identify unidentified aerial target over Lithuanian airspace", "JRC/HT classification(s)": "JRC-AIRSPACE", "Short description": "On November 5 NATO Air Policing fighter jets were dispatched to intercept an unidentified aerial target in the Lithuanian airspace, however, the alert trigger was not detected.", "Key source": "Lithuanian Ministry of National Defence (KAM), KAM_Interceptions_2025.pdf, p. 43", "Verification": "VERIFIED", "Attribution / status": "Unknown aerial target; attribution not established"}, {"Incident ID": "LT-068", "date": "2025-11-08", "Event / campaign": "Balloon alert temporarily suspended Vilnius Airport operations", "JRC/HT classification(s)": "HT-BALLOON; JRC-AIRSPACE; HT-AIRPORT-DISRUPTION", "Short description": "Operations were suspended at 20:45 after a balloon or balloons were reported flying toward Vilnius Airport; operations resumed at 21:50. Four flights and about 600 passengers were affected.", "Key source": "Vilnius Airport", "Verification": "VERIFIED", "Attribution / status": "BELARUS_ORIGIN"}, {"Incident ID": "LT-069", "date": "2025-11-11", "Event / campaign": "NATO air-policing response to aerial target", "JRC/HT classification(s)": "JRC-AIRSPACE", "Short description": "On November 11 NATO fighter jets were scrambled to identify an aerial target in the airspace of Lithuania. No object was found.", "Key source": "Lithuanian Ministry of National Defence (KAM), KAM_Interceptions_2025.pdf, p. 44", "Verification": "VERIFIED", "Attribution / status": "Unknown aerial target; attribution not established"}, {"Incident ID": "LT-070", "date": "2025-11-12", "Event / campaign": "Contraband drone carrying 1,000 cigarette packs intercepted near Naniškiai", "JRC/HT classification(s)": "HT-DRONE; HT-BORDER", "Short description": "VSAT used an anti-drone system to down a homemade drone entering from Belarus. The payload was 1,000 cigarette packs and a GPS tracker with a SIM card. VSAT reported that 53 such contraband drones had already been intercepted in 2025.", "Key source": "Lithuanian State Border Guard Service", "Verification": "VERIFIED", "Attribution / status": "ORGANISED_SMUGGLING"}, {"Incident ID": "LT-071", "date": "2025-11-20", "Event / campaign": "Balloon closure disrupted Vilnius Airport and delayed Lithuanian foreign minister's flight", "JRC/HT classification(s)": "HT-BALLOON; JRC-AIRSPACE; HT-AIRPORT-DISRUPTION", "Short description": "Airspace restrictions from 18:38 to 19:55 affected around 1,100 passengers and ten flights. The aircraft carrying Foreign Minister Kęstutis Budrys and EU Commissioner Andrius Kubilius from Brussels was delayed in reaching Vilnius.", "Key source": "LRT / Reuters reporting", "Verification": "VERIFIED", "Attribution / status": "BELARUS_ORIGIN; OFFICIAL_HYBRID_CHARACTERISATION"}, {"Incident ID": "LT-072", "date": "2025-11-23", "Event / campaign": "Two separate balloon closures of Vilnius Airport overnight", "JRC/HT classification(s)": "HT-BALLOON; JRC-AIRSPACE; HT-AIRPORT-DISRUPTION", "Short description": "Airspace restrictions were imposed from 18:55 to 00:25 and again from 01:40 to 03:25 as balloon navigation traces approached the airport.", "Key source": "Vilnius Airport", "Verification": "VERIFIED", "Attribution / status": "BELARUS_ORIGIN"}, {"Incident ID": "LT-073", "date": "2025-11-28", "Event / campaign": "Long overnight balloon closure of Vilnius Airport", "JRC/HT classification(s)": "HT-BALLOON; JRC-AIRSPACE; HT-AIRPORT-DISRUPTION", "Short description": "Restrictions began at 23:15 on 28 November and were lifted at 07:03 on 29 November. More than 3,000 passengers and 22 flights were affected; three flights were cancelled and nine diverted.", "Key source": "Vilnius Airport", "Verification": "VERIFIED", "Attribution / status": "BELARUS_ORIGIN"}, {"Incident ID": "LT-074", "date": "2025-11-30", "Event / campaign": "Major overnight balloon closure affecting 7,400 passengers", "JRC/HT classification(s)": "HT-BALLOON; JRC-AIRSPACE; HT-AIRPORT-DISRUPTION", "Short description": "Restrictions began at 18:09 on 30 November and lasted until 05:00 on 1 December. More than 7,400 passengers and 50 flights were affected: 31 cancellations, 10 diversions and nine delays.", "Key source": "Vilnius Airport", "Verification": "VERIFIED", "Attribution / status": "BELARUS_ORIGIN"}, {"Incident ID": "LT-075", "date": "2025-12-03", "Event / campaign": "Three balloon-related airport closures in one night", "JRC/HT classification(s)": "HT-BALLOON; JRC-AIRSPACE; HT-AIRPORT-DISRUPTION", "Short description": "On 3–4 December, Vilnius Airport airspace was closed three times after balloon-type navigation signals were detected. Twenty-seven flights and 3,134 passengers were affected; five flights were cancelled and five diverted.", "Key source": "Vilnius Airport", "Verification": "VERIFIED", "Attribution / status": "BELARUS_ORIGIN; OFFICIAL_HYBRID_CHARACTERISATION"}, {"Incident ID": "LT-076", "date": "2025-12-06", "Event / campaign": "Third balloon-related airport disruption in the first week of December", "JRC/HT classification(s)": "HT-BALLOON; JRC-AIRSPACE; HT-AIRPORT-DISRUPTION", "Short description": "Vilnius Airport briefly suspended operations after unidentified objects believed to be Belarusian contraband balloons were detected in surrounding airspace.", "Key source": "Reuters / Kyiv Independent reporting", "Verification": "PROBABLE", "Attribution / status": "BELARUS_ORIGIN"}, {"Incident ID": "LT-077", "date": "2025-12-07", "Event / campaign": "Balloon-related Vilnius Airport disruption immediately before emergency declaration", "JRC/HT classification(s)": "HT-BALLOON; JRC-AIRSPACE; HT-AIRPORT-DISRUPTION; JRC-COERCE-GOV", "Short description": "Vilnius Airport was again suspended because of balloon-type navigation signals. The repeated December disruptions preceded the government's 9 December declaration of an emergency over the balloon threat.", "Key source": "LRT / international reporting", "Verification": "PROBABLE", "Attribution / status": "BELARUS_ORIGIN"}, {"Incident ID": "LT-078", "date": "2026-01-01", "Event / campaign": "Continued Belarusian instrumentalisation of migration pressure", "JRC/HT classification(s)": "JRC-MIG-BARGAIN; JRC-IMMIGRATION-POLITICAL; HT-BORDER", "Short description": "Lithuanian authorities continued to describe instrumentalised migration from Belarus as an ongoing hybrid activity. In 2025, 1,652 attempted illegal entries from Belarus were prevented.", "Key source": "Lithuanian Interior Ministry / VSAT", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_CHARACTERISED_AS_HYBRID_ACTIVITY"}, {"Incident ID": "LT-079", "date": "2026-01-01", "Event / campaign": "FSB recruitment of travellers from Lithuania to Russia and third-country lorry drivers", "JRC/HT classification(s)": "HT-RECRUITMENT; HT-ESPIONAGE; JRC-INTEL-PREP", "Short description": "VSD reported that the FSB actively identifies and pressures potential intelligence targets travelling from Lithuania to Russia, including third-country lorry drivers, seeking military and Ukraine-related information.", "Key source": "VSD threat reporting", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_ASSESSED"}, {"Incident ID": "LT-080", "date": "2026-01-26", "Event / campaign": "Russian IL-20 intercepted/identified near Lithuanian airspace", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-INTEL-PREP", "Short description": "NATO Baltic Air Policing aircraft identified and escorted a Russian IL-20 flying between mainland Russia and Kaliningrad without normal transponder/flight-plan compliance.", "Key source": "SAHASEC / Lithuanian Ministry of Defence", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_DOCUMENTED"}, {"Incident ID": "LT-081", "date": "2026-01-27", "Event / campaign": "Three balloon-related closures of Vilnius Airport in one night", "JRC/HT classification(s)": "HT-BALLOON; JRC-AIRSPACE; HT-AIRPORT-DISRUPTION", "Short description": "On 27–28 January, Lithuanian military radar detected 42 balloon-like tracks. Vilnius Airport was closed three times; 21 flights and about 2,400 passengers were affected, with five diversions and 16 delays.", "Key source": "Lithuanian Ministry of Interior / Lithuanian Airports", "Verification": "VERIFIED", "Attribution / status": "BELARUS_ORIGIN; OFFICIAL_HYBRID_CHARACTERISATION"}, {"Incident ID": "LT-082", "date": "2026-01-28", "Event / campaign": "Contraband drone carrying cigarettes intercepted during balloon campaign", "JRC/HT classification(s)": "HT-DRONE; HT-BORDER", "Short description": "During the January balloon crisis, VSAT detected a likely contraband drone entering Lithuanian territory near Purvėnai and brought it down using counter-UAS equipment.", "Key source": "Lithuanian State Border Guard Service", "Verification": "VERIFIED", "Attribution / status": "ORGANISED_SMUGGLING"}, {"Incident ID": "LT-083", "date": "2026-02-09", "Event / campaign": "Russian IL-20 flight triggered NATO air-policing scramble", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-INTEL-PREP", "Short description": "NATO fighter aircraft were scrambled after detecting a Russian IL-20 flying from mainland Russia toward Kaliningrad.", "Key source": "SAHASEC / Lithuanian Ministry of Defence", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_DOCUMENTED"}, {"Incident ID": "LT-084", "date": "2026-02-13", "Event / campaign": "Russian Su-24MR and Su-33 flight triggered NATO air-policing response", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-MIL-CONVENTIONAL", "Short description": "NATO air-policing aircraft responded to Russian Su-24MR and Su-33 aircraft flying between mainland Russia and Kaliningrad.", "Key source": "SAHASEC / Lithuanian Ministry of Defence", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_DOCUMENTED"}, {"Incident ID": "LT-085", "date": "2026-02-14", "Event / campaign": "Second Russian Su-24MR/Su-33 flight triggered NATO response", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-MIL-CONVENTIONAL", "Short description": "NATO aircraft again responded to Russian Su-24MR and Su-33 activity on the Kaliningrad corridor.", "Key source": "SAHASEC / Lithuanian Ministry of Defence", "Verification": "VERIFIED", "Attribution / status": "OFFICIALLY_DOCUMENTED"}, {"Incident ID": "LT-086", "date": "2026-03-24", "Event / campaign": "Belarus begins releasing detained Lithuanian freight vehicles after months of detention", "JRC/HT classification(s)": "JRC-ECON n. The Su-27s did not have the flight plan, their onboard transponders were oﬀ, not maintaining radio communication with the regional air traﬃc control centre. The AN-26 had no flight plan, its onboard transponder was on, the crew kept radio commination with the regional traﬃc control centre.", "Key source": "Lithuanian Ministry of National Defence (KAM), KAM_Interceptions_2022.pdf, p. 33", "Verification": "VERIFIED", "Attribution / status": "Russian state aircraft; hostile intent not established"}, {"Incident ID": "REG-105", "date": "2022-10-04", "Event / campaign": "Russian IL-76, SU-27, SU-30S aircraft triggered NATO interception", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-MIL-CONVENTIONAL", "Short description": "On October 4 NATO fighter jets intercepted one IL-76 flying from mainland Russia to Kaliningrad via international airspace with its onboard transponder on, without the flight plan, but maintaining radio communication. The IL-76 was escorted by two SU-27 aircraft which flew into international airspace from Kaliningrad and later returned. Their onboard transponders were oﬀ, the crews had no flight plan and were not maintaining radio communication. The aircraft was also escorted by two SU-30s that flew into international airspace from mainland Russia and later returned. Their onboard transponders were oﬀ, the crews had no flight plan and were not maintaining radio communication.", "Key source": "Lithuanian Ministry of National Defence (KAM), KAM_Interceptions_2022.pdf, p. 33", "Verification": "VERIFIED", "Attribution / status": "Russian state aircraft; hostile intent not established"}, {"Incident ID": "REG-106", "date": "2022-10-05", "Event / campaign": "Russian IL-76, SU-27S aircraft triggered NATO interception", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-MIL-CONVENTIONAL", "Short description": "On October 5 fighter aircraft conducting the NATO Baltic Air Policing tasks intercepted one IL-76 flying from Kaliningrad to mainland Russia via international airspace. Its onboard transponder was on, the crew had the flight plan and kept radio communication. The IL-76 was escorted by two SU-27s which flew into international airspace from Kaliningrad and later returned. Their onboard transponders were oﬀ, the crews had no flight plan and were not maintaining radio communication.", "Key source": "Lithuanian Ministry of National Defence (KAM), KAM_Interceptions_2022.pdf, p. 33", "Verification": "VERIFIED", "Attribution / status": "Russian state aircraft; hostile intent not established"}, {"Incident ID": "REG-107", "date": "2022-10-05", "Event / campaign": "Russian IL-76, SU-30S aircraft triggered NATO interception", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-MIL-CONVENTIONAL", "Short description": "On October 5 NATO aircraft intercepted one IL-76 heading for mainland Russia through international airspace from Kaliningrad. Its onboard transponder was on, the crew had the flight plan and kept radio communication. The NATO aircraft also intercepted two SU-30s that flew into international airspace from mainland Russia and then back. Their onboard transponders were oﬀ, the crews had no flight plan and were not maintaining radio communication.", "Key source": "Lithuanian Ministry of National Defence (KAM), KAM_Interceptions_2022.pdf, p. 33", "Verification": "VERIFIED", "Attribution / status": "Russian state aircraft; hostile intent not established"}, {"Incident ID": "REG-108", "date": "2022-10-11", "Event / campaign": "Russian TU-134 aircraft triggered NATO interception", "JRC/HT classification(s)": "JRC-AIRSPACE; JRC-MIL-CONVENTIONAL", "Short description": "On October 11 NATO air policing fighter aircraft intercepted one TU-134 flying from Kaliningrad oblast to the mainland of the Russian Federation via international airspace with its onboard transponder oﬀ, without the pre-filed flight plan, keeping radio contact with the regional air traﬃc control centre.", "Key source": "Lithuanian Ministry of National Defence (KAM),
